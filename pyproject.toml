[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-bump-inverse-design"
version = "1.0.0"
description = "Gaussian-process surrogate modelling and inverse design for Gaussian interfacial bumps"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [
  {name = "Guangchao Yang"},
  {name = "Xinzhong Zhou"},
  {name = "Xiaojing Liu"},
  {name = "Jinbiao Xiong"},
  {name = "Xiang Chai"},
  {name = "Tengfei Zhang"},
  {name = "Hui He"},
]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[tool.setuptools.packages.find]
where = ["src"]
